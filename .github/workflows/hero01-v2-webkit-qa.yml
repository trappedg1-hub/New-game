name: Temporary HERO-01 V2 WebKit verification
on:
  push:
    branches: [arena/680e6caa-new-game]
    paths: [.github/workflows/hero01-v2-webkit-qa.yml]
permissions:
  contents: read
jobs:
  iphone-sized-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ArtStudio/Prototypes/hero01-idle-v2
    env:
      HERO_TEST_URL: http://127.0.0.1:4173/
      HERO_SCREENSHOT: /tmp/hero01-v2-iphone-webkit.png
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, test and build prototype
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Install WebKit
        run: npx playwright-core install --with-deps webkit
      - name: Check iPhone-sized WebKit against V2 production build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hero01-v2-server.log 2>&1 &
          node -e "const end=Date.now()+30000; (async function check(){try{if((await fetch('http://127.0.0.1:4173/')).ok)return;}catch{}if(Date.now()>end)process.exit(1);setTimeout(check,250)})()"
          npm run test:webkit
      - name: Save mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero01-v2-webkit-check
          path: /tmp/hero01-v2-iphone-webkit.png
          if-no-files-found: ignore
          retention-days: 3
