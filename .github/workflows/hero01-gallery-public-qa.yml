name: HERO-01 gallery public QA
on:
  push:
    branches: [arena/680e6caa-new-game]
    paths:
      - '.github/workflows/hero01-gallery-public-qa.yml'
      - 'ArtStudio/Prototypes/hero01-costume-gallery/scripts/browser-qa.mjs'
  workflow_dispatch:
    inputs:
      gallery_url:
        description: Public URL ending in /collection/
        required: true
        type: string
permissions:
  contents: read
jobs:
  public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix ArtStudio/Prototypes/hero01-night-step ci
      - name: Check the gallery and embedded previews
        run: |
          set -o pipefail
          node ArtStudio/Prototypes/hero01-costume-gallery/scripts/browser-qa.mjs 2>&1 | tee /tmp/hero01-gallery-qa.log
        env:
          GALLERY_URL: ${{ inputs.gallery_url || 'https://hero01-idle-prototype.vercel.app/collection/' }}
      - name: Report public QA failure details
        if: failure()
        run: |
          details=$(tail -c 5000 /tmp/hero01-gallery-qa.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Public gallery QA::$details"
