name: Temporary HERO-01 Vercel browser verification
on:
  push:
    branches: [arena/680e6caa-new-game]
    paths: [.github/workflows/hero01-vercel-qa.yml]
permissions:
  contents: read
jobs:
  production-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ArtStudio/Prototypes/hero01-idle
    env:
      HERO_TEST_URL: https://hero01-idle-prototype.vercel.app/
      HERO_PRODUCTION: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install prototype test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop Chromium and WebKit
        run: npx playwright-core install --with-deps chromium webkit
      - name: Desktop and mobile Chromium checks against Vercel
        run: npm run test:ui
      - name: iPhone-sized WebKit and deployed image integrity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { webkit, devices } from 'playwright-core';
          const browser = await webkit.launch({ headless: true });
          const context = await browser.newContext({ ...devices['iPhone 13'], reducedMotion: 'no-preference' });
          const page = await context.newPage();
          const errors = [];
          const responses = [];
          page.on('pageerror', error => errors.push(`Page error: ${error}`));
          page.on('console', msg => { if (msg.type() === 'error') errors.push(`Console: ${msg.text()}`); });
          page.on('requestfailed', req => errors.push(`Request failed: ${req.url()} ${req.failure()?.errorText}`));
          page.on('response', response => responses.push(response));
          try {
            const main = await page.goto(process.env.HERO_TEST_URL, { waitUntil: 'networkidle', timeout: 60000 });
            assert.equal(main.status(), 200, 'production page must be publicly accessible');
            await page.waitForSelector('#loading[hidden]', { state: 'attached', timeout: 45000 });
            assert.equal(await page.locator('#error-message').isHidden(), true, 'WebKit scene initialization failed');
            assert.equal(await page.locator('.viewport canvas').count(), 2, 'both canvases must render');
            assert.equal(await page.locator('#play-toggle').isEnabled(), true);
            const size = await page.evaluate(() => ({width: document.documentElement.clientWidth, scroll: document.documentElement.scrollWidth}));
            assert.ok(size.scroll <= size.width, `horizontal overflow: ${JSON.stringify(size)}`);
            const artwork = responses.find(r => /HERO-01_outfit02_playful_maid[^/]*\.png/.test(r.url()));
            assert.ok(artwork, 'approved image was not requested');
            assert.equal(artwork.status(), 200);
            const hash = createHash('sha256').update(await artwork.body()).digest('hex');
            assert.equal(hash, '91111189c23d1d7ac424e85d3406202bf028e8d3330ae8c50b33223312f236fd', 'deployed artwork differs from the approved original');
            const derived = responses.filter(r => /\/derived\/eye_.*\.png/.test(r.url()));
            assert.equal(derived.length, 6, 'six eye patches should load');
            assert.ok(derived.every(r => r.status() === 200), 'eye patches must load successfully');
            const animated = page.locator('#animated-view');
            await page.locator('#intensity').evaluate(input => { input.value = '150'; input.dispatchEvent(new Event('input', { bubbles: true })); });
            const motionA = await animated.screenshot();
            await page.waitForTimeout(1200);
            const motionB = await animated.screenshot();
            assert.notDeepEqual(motionA, motionB, 'body animation must change the rendered frame');
            await page.locator('#view-face').click();
            assert.equal(await page.locator('#view-face').getAttribute('aria-pressed'), 'true');
            await page.locator('#play-toggle').click();
            assert.equal(await page.locator('#play-toggle').getAttribute('aria-pressed'), 'true');
            await page.waitForTimeout(500);
            const pausedA = await animated.screenshot();
            await page.waitForTimeout(500);
            const pausedB = await animated.screenshot();
            assert.deepEqual(pausedA, pausedB, 'paused animation must freeze');
            await page.locator('#blink-button').click();
            await page.waitForTimeout(120);
            const blinking = await animated.screenshot();
            assert.notDeepEqual(pausedB, blinking, 'manual blink must change the rendered frame while paused');
            await page.screenshot({ path: '/tmp/hero-vercel-iphone-webkit.png', fullPage: true });
            assert.deepEqual(errors, [], `browser errors: ${errors.join('\n')}`);
            console.log(`PASS: public Vercel URL, deployed source SHA-256 ${hash}, six eye assets, iPhone 13-sized WebKit layout, animation, pause and blink.`);
          } finally { await browser.close(); }
          JS
      - name: Save mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero01-vercel-webkit-check
          path: /tmp/hero-vercel-iphone-webkit.png
          if-no-files-found: ignore
          retention-days: 3
